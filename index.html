<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة الألوان باللغة الإنجليزية للأطفال 🎨</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #fdfbf7 0%, #efebe9 100%);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            color: #3e2723;
        }

        #game-container {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
            border: 8px solid #ffb300;
            overflow: hidden;
            text-align: center;
            position: relative;
        }

        /* واجهات اللعبة */
        .screen {
            padding: 30px 20px;
            display: none;
        }

        .screen.active {
            display: block;
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        h1 {
            color: #d84315;
            font-size: 2.2rem;
            margin-bottom: 5px;
            text-shadow: 2px 2px #ffccbc;
        }

        p.subtitle {
            font-size: 1.2rem;
            color: #5d4037;
            margin-bottom: 25px;
            font-weight: bold;
        }

        .hero-icon {
            font-size: 5rem;
            margin-bottom: 20px;
        }

        /* أزرار اللعبة */
        .btn-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .btn {
            background: linear-gradient(to bottom, #ff9800, #f57c00);
            color: white;
            border: none;
            padding: 15px 35px;
            font-size: 1.3rem;
            font-weight: 900;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 6px #e65100, 0 10px 15px rgba(0,0,0,0.1);
            transition: 0.1s;
            margin: 5px;
        }

        .btn:active {
            box-shadow: 0 2px #e65100;
            transform: translateY(4px);
        }

        .btn-blue {
            background: linear-gradient(to bottom, #2196f3, #1976d2);
            box-shadow: 0 6px #0d47a1, 0 10px 15px rgba(0,0,0,0.1);
        }

        .btn-blue:active {
            box-shadow: 0 2px #0d47a1;
        }

        /* أقسام التعلم */
        .colors-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .color-card {
            background: #efebe9;
            border-radius: 20px;
            padding: 15px;
            text-align: center;
            border: 3px solid #d7ccc8;
            cursor: pointer;
            transition: transform 0.2s;
        }

        .color-card:hover {
            transform: scale(1.05);
        }

        .color-circle {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            margin: 0 auto 10px auto;
            border: 3px solid white;
            box-shadow: 0 3px 6px rgba(0,0,0,0.1);
        }

        .color-card span {
            font-size: 1.2rem;
            font-weight: bold;
            display: block;
        }
        
        .color-card span.en {
            color: #d84315;
            font-size: 1.4rem;
        }

        /* قسم الاختبار التفاعلي */
        .quiz-color-box {
            width: 150px;
            height: 150px;
            border-radius: 20px;
            margin: 15px auto;
            border: 5px solid #fff;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
            display: block;
        }

        .quiz-options-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 20px 0;
        }

        .quiz-option {
            background: #fff;
            border: 4px solid #cfd8dc;
            border-radius: 20px;
            padding: 20px;
            font-size: 1.5rem;
            font-weight: bold;
            cursor: pointer;
            width: 150px;
            transition: all 0.2s;
            box-shadow: 0 5px 10px rgba(0,0,0,0.05);
        }

        .quiz-option:hover {
            border-color: #ffb300;
            transform: translateY(-3px);
        }

        .quiz-option span {
            font-size: 1.1rem;
            color: #78909c;
            display: block;
            margin-top: 5px;
        }

        .correct {
            background-color: #c8e6c9 !important;
            border-color: #4caf50 !important;
            color: #2e7d32 !important;
        }

        .incorrect {
            background-color: #ffcdd2 !important;
            border-color: #f44336 !important;
            color: #c62828 !important;
        }

        .feedback {
            font-size: 1.4rem;
            font-weight: bold;
            margin-top: 15px;
            min-height: 40px;
        }

        .stars {
            font-size: 4rem;
            color: #ffca28;
            margin: 20px 0;
            animation: bounce 1s infinite alternate;
        }

        @keyframes bounce {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }

        @media (max-width: 600px) {
            h1 { font-size: 1.8rem; }
            .quiz-options-container { flex-direction: column; align-items: center; }
            .quiz-option { width: 80%; padding: 12px; }
        }
    </style>
</head>
<body>

<div id="game-container">

    <!-- شاشة البداية -->
    <div id="screen-start" class="screen active">
        <h1>🎨 لعبة الألوان 🎨</h1>
        <p class="subtitle">تعلم واكتشف الألوان الجميلة من حولنا باللغة الإنجليزية!</p>
        
        <div class="hero-icon">🖍️🌈</div>

        <div class="btn-container">
            <button class="btn btn-blue" onclick="showScreen('screen-learn')">📖 دعنا نتعلم</button>
            <button class="btn" onclick="startQuiz()">🎮 ابدأ اللعب</button>
        </div>
    </div>

    <!-- شاشة التعلم -->
    <div id="screen-learn" class="screen">
        <h1>تعلم الألوان</h1>
        <p class="subtitle">اضغط على اللون لتتعلم اسمه</p>

        <div class="colors-grid">
            <div class="color-card" onclick="speak('Red')">
                <div class="color-circle" style="background-color: #f44336;"></div>
                <span class="en">Red</span>
                <span>أحمر</span>
            </div>
            <div class="color-card" onclick="speak('Blue')">
                <div class="color-circle" style="background-color: #2196f3;"></div>
                <span class="en">Blue</span>
                <span>أزرق</span>
            </div>
            <div class="color-card" onclick="speak('Green')">
                <div class="color-circle" style="background-color: #4caf50;"></div>
                <span class="en">Green</span>
                <span>أخضر</span>
            </div>
            <div class="color-card" onclick="speak('Yellow')">
                <div class="color-circle" style="background-color: #ffeb3b;"></div>
                <span class="en">Yellow</span>
                <span>أصفر</span>
            </div>
            <div class="color-card" onclick="speak('Orange')">
                <div class="color-circle" style="background-color: #ff9800;"></div>
                <span class="en">Orange</span>
                <span>برتقالي</span>
            </div>
            <div class="color-card" onclick="speak('Purple')">
                <div class="color-circle" style="background-color: #9c27b0;"></div>
                <span class="en">Purple</span>
                <span>بنفسجي</span>
            </div>
        </div>

        <button class="btn" onclick="showScreen('screen-start')">🏠 القائمة الرئيسية</button>
    </div>

    <!-- شاشة الاختبار -->
    <div id="screen-quiz" class="screen">
        <h1>ما هذا اللون؟</h1>
        
        <div id="quiz-color" class="quiz-color-box"></div>

        <div class="quiz-options-container" id="quiz-options">
            <!-- الخيارات تظهر هنا عن طريق الجافاسكريبت -->
        </div>

        <div class="feedback" id="quiz-feedback"></div>

        <div class="btn-container">
            <button id="next-btn" class="btn btn-blue" style="display: none;" onclick="nextQuestion()">السؤال التالي ➡️</button>
        </div>
    </div>

    <!-- شاشة النتيجة -->
    <div id="screen-result" class="screen">
        <h1>عمل رائع! 🎉</h1>
        <div class="stars">⭐⭐⭐</div>
        <p class="subtitle">لقد أجبت بشكل صحيح على <span id="score-text"></span> أسئلة!</p>
        
        <div class="btn-container">
            <button class="btn btn-blue" onclick="startQuiz()">🔄 العب مرة أخرى</button>
            <button class="btn" onclick="showScreen('screen-start')">🏠 القائمة الرئيسية</button>
        </div>
    </div>

</div>

<script>
    // قاعدة بيانات الألوان للاختبار
    const colors = [
        { name: "Red", hex: "#f44336", ar: "أحمر" },
        { name: "Blue", hex: "#2196f3", ar: "أزرق" },
        { name: "Green", hex: "#4caf50", ar: "أخضر" },
        { name: "Yellow", hex: "#ffeb3b", ar: "أصفر" },
        { name: "Orange", hex: "#ff9800", ar: "برتقالي" },
        { name: "Purple", hex: "#9c27b0", ar: "بنفسجي" },
        { name: "Black", hex: "#000000", ar: "أسود" },
        { name: "White", hex: "#ffffff", ar: "أبيض" }
    ];

    let currentQuestionIndex = 0;
    let score = 0;
    let quizQuestions = [];

    // دالة التبديل بين الشاشات
    function showScreen(screenId) {
        document.querySelectorAll('.screen').forEach(screen => {
            screen.classList.remove('active');
        });
        document.getElementById(screenId).classList.add('active');
    }

    // دالة نطق الكلمة الإنجليزية
    function speak(text) {
        if ('speechSynthesis' in window) {
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'en-US';
            speechSynthesis.speak(utterance);
        }
    }

    // بدء الاختبار
    function startQuiz() {
        score = 0;
        currentQuestionIndex = 0;
        
        // خلط الألوان عشوائياً لاختيار 5 أسئلة
        quizQuestions = [...colors].sort(() => 0.5 - Math.random()).slice(0, 5);
        
        showScreen('screen-quiz');
        loadQuestion();
    }

    // تحميل السؤال
    function loadQuestion() {
        const question = quizQuestions[currentQuestionIndex];
        const colorBox = document.getElementById('quiz-color');
        const optionsContainer = document.getElementById('quiz-options');
        const feedback = document.getElementById('quiz-feedback');
        const nextBtn = document.getElementById('next-btn');

        // إعداد اللون
        colorBox.style.backgroundColor = question.hex;
        feedback.textContent = "";
        nextBtn.style.display = "none";

        // تجهيز الخيارات (الإجابة الصحيحة + إجابتين خاطئتين عشوائيتين)
        let options = [question];
        let remainingColors = colors.filter(c => c.name !== question.name);
        remainingColors.sort(() => 0.5 - Math.random());
        options.push(remainingColors[0], remainingColors[1]);
        
        // خلط الخيارات
        options.sort(() => 0.5 - Math.random());

        // عرض الخيارات كأزرار
        optionsContainer.innerHTML = "";
        options.forEach(opt => {
            const btn = document.createElement('div');
            btn.className = 'quiz-option';
            btn.innerHTML = `${opt.name} <span>${opt.ar}</span>`;
            btn.onclick = () => checkAnswer(opt.name, question.name, btn);
            optionsContainer.appendChild(btn);
        });
    }

    // التحقق من الإجابة
    function checkAnswer(selected, correct, btnElement) {
        const feedback = document.getElementById('quiz-feedback');
        const options = document.querySelectorAll('.quiz-option');
        const nextBtn = document.getElementById('next-btn');

        // تعطيل الأزرار بعد الاختيار
        options.forEach(opt => opt.style.pointerEvents = 'none');

        if (selected === correct) {
            btnElement.classList.add('correct');
            feedback.textContent = "✅ أحسنت! إجابة صحيحة";
            feedback.style.color = "#2e7d32";
            speak(correct);
            score++;
        } else {
            btnElement.classList.add('incorrect');
            feedback.textContent = "❌ حاول مرة أخرى! الإجابة الصحيحة هي: " + correct;
            feedback.style.color = "#c62828";
            
            // إظهار الإجابة الصحيحة
            options.forEach(opt => {
                if(opt.innerHTML.includes(correct)) {
                    opt.classList.add('correct');
                }
            });
        }

        nextBtn.style.display = "inline-block";
    }

    // الانتقال للسؤال التالي
    function nextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < quizQuestions.length) {
            loadQuestion();
        } else {
            showResult();
        }
    }

    // عرض النتيجة النهائية
    function showResult() {
        document.getElementById('score-text').textContent = `${score} من ${quizQuestions.length}`;
        showScreen('screen-result');
    }
</script>

</body>
</html>
